services:
  mysql:
    image: mysql:8.0
    container_name: minh_aquarium_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: minh123
      MYSQL_DATABASE: minh_aquarium
      MYSQL_USER: minh_user
      MYSQL_PASSWORD: minh123
    ports:
      - "3307:3306"
    volumes:
      - ./server/db/database.sql:/docker-entrypoint-initdb.d/database.sql
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pminh123"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: minh_aquarium_api
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: minh_user
      DB_PASSWORD: minh123
      DB_NAME: minh_aquarium
      PORT: 3000
      ENABLE_GEMINI: ${ENABLE_GEMINI:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-1.5-flash}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON:-}
      FIREBASE_SERVICE_ACCOUNT_PATH: ${FIREBASE_SERVICE_ACCOUNT_PATH:-}
      CHAT_RATE_LIMIT_PER_MINUTE: ${CHAT_RATE_LIMIT_PER_MINUTE:-12}
      CHAT_RETENTION_DAYS: ${CHAT_RETENTION_DAYS:-30}
      STAFF_PHONE: ${STAFF_PHONE:-0123456789}
      STAFF_ZALO_LINK: ${STAFF_ZALO_LINK:-}
    ports:
      - "3000:3000"

volumes:
  mysql_data:
